在《Phigros》的非课题模式（即常规单曲结算）中，分数和ACC是两个独立计算的系统：总分由90%的判定分和10%的连击分构成，而ACC（准确度）只衡量打击精准度，与连击无关。

以下是具体的计算公式和规则：

1. 单曲总分计算公式

满分为 1,000,000，拆分为判定分和连击分两部分：

· 判定分（占90万）：计算所有音符的基础判定。
  · Perfect：获得该音符 100% 的判定分。
  · Good：获得该音符 65% 的判定分。
  · Bad / Miss：获得 0% 的判定分。
  · 公式：判定分 = 900,000 × (Perfect数 + Good数 × 0.65) / 总音符数。
· 连击分（占10万）：仅与最大连击数（Max Combo）有关。
  · 公式：连击分 = 100,000 × (最大连击数 / 总音符数)。

补充：如果是课题模式，则没有连击分，分数直接等于ACC × 1,000,000。

---

2. 单曲ACC计算公式

ACC（Accuracy，打击精准度）满分为 100.00%，它不包含任何连击分，只反映你的打击准确度：

· Perfect：获得 100% 的ACC。
· Good：获得 65% 的ACC。
· Bad / Miss：获得 0% 的ACC。

公式为：ACC = (Perfect数 + Good数 × 0.65) / 总音符数 × 100%。

---

3. 重要结论

· 分数与ACC不一定挂钩：由于连击分的存在，可能出现“分数高但ACC低”或“ACC高但分数低”的情况。只有当谱面达成全连（FC）时，分数和ACC才会呈现正相关。
· 结算评级：分数对应以下评级：
  · φ (Phi)：1,000,000（All Perfect）
  · ν (V)：960,000 – 999,999
  · S：920,000 – 959,999
  · A：880,000 – 919,999
  · B：820,000 – 879,999
  · C：700,000 – 819,999
  · False(2.0.0版本后取首字母F)：0 – 699,999

· 结算分数：直接在结算界面显示的总分数，精确到1（即取整数部分），采用的是向下取整的截断方式。搜索结果没有找到“四舍五入”的说明，通常这种精确到个位数的分数就是直接截断显示的。
· Accuracy (ACC)：结算界面显示的准确度会精确到小数点后2位，但系统内部实际是用更精确的数据来计算 rks。
· Ranking Score (rks)：最终的个人 rks 值会按公式计算后四舍五入，精确到小数点后2位。

简单来说，只有结算界面那个具体的分数数字是截断的，跟玩家水平相关的ACC和rks在计算中会涉及四舍五入。

// 实时替换输入框文本（自动修正光标位置）
function autoReplace(id, regex, replace = '') {
    const input = document.getElementById(id);
    if (!input) return; // 容错
    
    input.addEventListener('input', function() {
        const pos = this.selectionStart;          // 记录光标位置
        const old = this.value;
        const now = old.replace(regex, replace);
        if (old === now) return;                  // 无变化就退出
        
        this.value = now;
        // 重新计算光标位置：光标前原文本替换后的长度
        const newPos = old.substring(0, pos).replace(regex, replace).length;
        this.setSelectionRange(newPos, newPos);
    });
}

function show(score, fc) {
    let correspond;
    
    // 评级
    if (score == 1_000_000) {
        correspond = "P";
    } else if (fc) {
        correspond = "L";
    } else if (score >= 960_000) {
        correspond = "V";
    } else if (score >= 920_000) {
        correspond = "S";
    } else if (score >= 880_000) {
        correspond = "A";
    } else if (score >= 820_000) {
        correspond = "B";
    } else if (score >= 700_000) {
        correspond = "C";
    } else {
        correspond = "F";
    }
    
    // 显示
    for (let i of ids) {
        if (i == correspond) {
            document.getElementById(i).classList.remove("hide");
        } else {
            document.getElementById(i).classList.add("hide");
        }
    }
}

function calculate() {
    // 取值
    const perfect = Number(document.getElementById("ipt-per").value);
    const good    = Number(document.getElementById("ipt-goo").value);
    const bad     = Number(document.getElementById("ipt-bad").value);
    const miss    = Number(document.getElementById("ipt-mis").value);
    const cb      = Number(document.getElementById("ipt-max").value);
    
    const total = perfect + good + bad + miss;

    // 检查不合理
    if (cb > perfect + good) {
        return w();
    }
    
    // 计算
    const panDingFen = 900_000 * (perfect + good * 0.65) / total;
    const lianJiFen = 100_000 * (cb / total);
    let score = (total != 0) ? (panDingFen + lianJiFen) : 1_000_000; // 校验除0

    const acc = (total != 0) ? (perfect + good * 0.65) / total : 1;

    // 课题
    if (isKeti) {
        score = acc * 1_000_000;
    }
    
    // 格式化
    const parsedScore = ~~score;
    const parsedAcc = (acc*100).toFixed(2);
    
    // 显示
    document.getElementById("res").classList.remove("hide");
    document.getElementById("res-score").textContent = `${parsedScore}`.padStart(7, '0');
    // 课题不必显示acc
    document.getElementById("res-acc").textContent = `${parsedAcc}%`;
    if (isKeti) {
        document.getElementById("area-acc").classList.add("hide");
    } else {
        document.getElementById("area-acc").classList.remove("hide");
    }
    show(parsedScore, (bad + miss == 0));

    return;
}

    if (nowIsAprilFoolsDay()) {
        for (let i = 1; i <= 2; i++) {
            document.getElementById(`phigros-${i}`).textContent = foolText;
        }
        document.title = `${foolText}分数计算器 | PYANAHIDA | GIT-MIT`;
    }
});
</script>
