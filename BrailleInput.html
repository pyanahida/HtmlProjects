    false,
    false
];
const show = document.getElementById("show");

function output() {
    // Acquire dot matrix
    let temp = [];
    for (let i = 0; i < 8; i++) {
        if (cond[i]) temp.push(`${i+1}`);
    }
    // Query character
    const gotChar = table[temp.join("")];
    if (gotChar === undefined) {
        gotChar = "\uFFFD";
    }
    show.textContent += gotChar;
}

function ac() {
    for (let i = 1; i <= 8; i++) {
        const circ = document.getElementById(`c${i}`);
        cond[i - 1] = false;
        circ.setAttribute('fill', '#FFF');
    }
}

window.addEventListener('load', () => {
    // Traverse
    for (let i = 1; i <= 8; i++) {
        const circ = document.getElementById(`c${i}`);
        circ.addEventListener('click', () => {
            // Is the modification activated
            cond[i - 1] = !cond[i - 1];
            // Modify the color based on whether it is lit or not
            circ.setAttribute('fill', cond[i - 1] ? '#000' : '#FFF');
        });
    }
});
