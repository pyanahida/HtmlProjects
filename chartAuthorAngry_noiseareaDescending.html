<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The chart author is angry. The noise area have descended.</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #000;
}

.noise-area {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 0%;
    background-color: rgba(229, 42, 42, 0.25);
    border: 3px solid #6D0000;
}
</style>
</head>
<body>
<div
    id="noise-area"
    class="noise-area"
></div>
<script>
let height = 0; // Unit: 0.001%
const el = document.getElementById('noise-area');

window.addEventListener('load', () => {
    const id = setInterval(() => {
        height += 125;
        el.style.height = `${height / 1000}%`;
    }, 50);
    if (height == 100 * 1000) {
        clearInterval(id);
    }
});
</script>
</body>
</html>
