<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test your phi-personality</title>
<style>
.hide {
  dispaly: none;
}
</style>
</head>
<body>
  <div id="Q1">
    <p>Q1: Choose a role according to your mood:</p>
    <button onclick="turnToPage(2)">鸠 (Hato)</button>
    <button onclick="turnToPage(2)">吉诺 (Gino)</button>
  </div>
  <div id="Q2">
    <p>Q2: What do you think he/she hates?</p>
    <button onclick="turnToPage(3)">Outdoors</button>
    <button onclick="turnToPage(3)">Indoors</button>
  </div>
  <div id="Q3">
    <p>Q1: Choose a food that you like:</p>
    <button onclick="turnToPage(4)">小笼包</button>
    <button onclick="turnToPage(4)">Note (?)</button>
  </div>
  <script>
    function turnToPage(page) {
      let i = 1;
      while (true) {
        const el = document.getElementById(`Q${i}`);
        if (el === null) break;
        if (i === page) el.classList.remove("hide");
        else el.classList.add("hide");
        i++;
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      turnToPage(1);
    });
  </script>
</body>
</html>
